[package]
name = "promptweb"
version = "0.1.0"
authors = ["kampon_seamakhoo"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
base64 = "0.22.1"
dioxus = { version = "0.7.1", features = ["router", "fullstack"] }
dioxus-free-icons = { version = "0.10.0", features = ["font-awesome-solid"] }
image = { version = "0.25.9", features = ["png"] }
qrcode = "0.14.1"

[web.watcher]
reload_html = true

[web.resource]
base_path = "/PromptWeb/"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
server = ["dioxus/server"]
