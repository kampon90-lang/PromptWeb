<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptPay QR Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            /* ใช้โทนสีม่วง-น้ำเงินเข้มจากภาพตัวอย่าง */
            background: linear-gradient(135deg, #4c3a81 0%, #2d264f 100%);
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(30, 27, 46, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body class="flex items-center justify-center p-4">

    <div class="max-w-md w-full">
        <div class="glass-card rounded-3xl shadow-2xl overflow-hidden p-8 space-y-6">

            <div class="text-center space-y-2">
                <div
                    class="inline-flex items-center justify-center w-16 h-16 bg-cyan-500 rounded-2xl mb-2 shadow-lg shadow-cyan-500/20">
                    <i class="fa-solid fa-qrcode text-3xl text-white"></i>
                </div>
                <h1 class="text-2xl font-bold text-white tracking-tight">PromptPay QR</h1>
                <p class="text-slate-400 text-sm">สร้างรหัส QR เพื่อรับเงินได้ทันที</p>
            </div>

            <div
                class="relative bg-white/5 rounded-2xl p-6 border border-white/10 flex flex-center justify-center min-h-[200px]">
                <div id="qrcode-container" class="flex flex-col items-center justify-center space-y-3">
                    <div
                        class="w-40 h-40 bg-slate-800 rounded-xl flex items-center justify-center border-2 border-dashed border-slate-600">
                        <i class="fa-solid fa-image text-4xl text-slate-600"></i>
                    </div>
                    <span class="text-slate-500 text-xs">QR Code จะปรากฏที่นี่</span>
                </div>
            </div>

            <div class="space-y-4">
                <div class="space-y-2">
                    <label
                        class="text-xs font-semibold text-cyan-400 uppercase tracking-wider ml-1">ข้อมูลผู้รับเงิน</label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i
                                class="fa-solid fa-id-card text-slate-500 group-focus-within:text-cyan-400 transition-colors"></i>
                        </div>
                        <input type="text"
                            placeholder="ใส่เบอร์โทรศัพท์ 10 หลัก รหัสบัตรประชาชน 13 หลัก หรือหมายเลข e-wallet 15 หลัก"
                            class="w-full bg-slate-900/50 border border-slate-700 text-white text-sm rounded-xl py-4 pl-11 pr-4 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all placeholder:text-slate-600">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider ml-1">จำนวนเงิน
                        (ไม่บังคับ)</label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fa-solid fa-baht-sign text-slate-500 group-focus-within:text-cyan-400"></i>
                        </div>
                        <input type="number" placeholder="0.00"
                            class="w-full bg-slate-900/50 border border-slate-700 text-white text-sm rounded-xl py-4 pl-11 pr-4 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all placeholder:text-slate-600">
                    </div>
                </div>
            </div>

            <button
                class="w-full bg-cyan-500 hover:bg-cyan-400 text-[#1e1b2e] font-bold py-4 rounded-xl shadow-lg shadow-cyan-500/20 active:scale-[0.98] transition-all flex items-center justify-center space-x-2">
                <span>สร้าง QR Code</span>
                <i class="fa-solid fa-bolt"></i>
            </button>
        </div>

        <p class="text-center text-slate-500 text-xs mt-6">
            <i class="fa-solid fa-lock mr-1"></i> ปลอดภัยและรองรับทุกแอปธนาคาร
        </p>
    </div>

</body>

</html>
